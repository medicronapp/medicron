<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1314" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica o tema escolhido antes da primeira pintura (sem piscar o tema errado) e escolhe o estilo da barra de
      // status do iPhone (escuro = translúcida, com o fundo do app atrás). Mesma chave do app: medicron.theme.
      try {
        var t = localStorage.getItem("medicron.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", dark ? "black-translucent" : "default");
        var color = dark ? "#0b1314" : "#fbfaf7";
        if (t === "light" || t === "dark") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", color);
        }
      } catch (e) {}
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: var(--background);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> Ative o JavaScript para usar o Medicron. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
